<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>پنل مدیریت NH</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: Vazirmatn, Tahoma, sans-serif;
        background: #0b0b0b;
        color: #f2f2f2;
        margin: 0;
        padding: 24px;
        overflow-x: hidden;
      }
      input,
      select {
        background: #151515;
        border: 1px solid #333;
        color: #fff;
        padding: 10px;
        margin: 4px 0;
        width: 100%;
        box-sizing: border-box;
      }
      button {
        background: #fff;
        color: #000;
        border: 0;
        padding: 10px 18px;
        cursor: pointer;
        font-weight: 700;
      }
      button.danger {
        background: #2a1414;
        color: #ff8080;
        border: 1px solid #522;
      }
      .table-scroll {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .table-scroll::-webkit-scrollbar {
        display: none;
      }
      table {
        width: 100%;
        min-width: 640px;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th,
      td {
        border-bottom: 1px solid #262626;
        padding: 10px;
        text-align: right;
        font-size: 0.85rem;
        white-space: nowrap;
      }
      .badge {
        padding: 2px 8px;
        font-size: 0.7rem;
        border: 1px solid #444;
      }
      .badge.manual {
        background: #1a1a2a;
        border-color: #446;
      }
      .badge.site {
        background: #141a14;
        border-color: #464;
      }
      .badge.cancelled {
        opacity: 0.4;
        text-decoration: line-through;
      }
      #loginBox {
        max-width: 340px;
        margin: 80px auto;
      }
      #panel {
        display: none;
        max-width: 1000px;
        margin: auto;
      }
      form#manualForm {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 8px;
        border: 1px solid #262626;
        padding: 16px;
        margin-top: 24px;
      }
      form#manualForm > button {
        grid-column: 1/-1;
      }
      .calendar-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }
      .calendar-label {
        font-size: 0.8rem;
        color: #999;
        letter-spacing: 0.5px;
      }
      .date-picker-wrap {
        position: relative;
        width: 42px;
        height: 42px;
      }
      .date-picker-btn {
        width: 42px;
        height: 42px;
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        line-height: 0;
        border: 1px solid #444;
        background: #151515;
        color: #ccc;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
      }
      .date-picker-btn:hover {
        border-color: #fff;
        color: #fff;
      }
      .date-picker-btn svg {
        display: block;
        width: 18px;
        height: 18px;
      }
      .cal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        z-index: 850;
        display: none;
      }
      .cal-backdrop.open {
        display: block;
      }
      .cal-popup {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 900;
        width: 280px;
        max-width: 88vw;
        background: #151515;
        border: 1px solid #333;
        padding: 16px;
        display: none;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      }
      .cal-popup.open {
        display: block;
      }
      .cal-pop-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .cal-pop-title {
        font-size: 0.95rem;
        font-weight: 700;
        color: #fff;
      }
      .cal-nav {
        width: 30px;
        height: 30px;
        padding: 0;
        border: 1px solid #333;
        background: #101010;
        color: #ccc;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        line-height: 1;
      }
      .cal-nav:hover {
        border-color: #777;
      }
      .cal-pop-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 6px;
      }
      .cal-head {
        text-align: center;
        font-size: 0.7rem;
        color: #777;
        padding: 2px 0 6px;
      }
      .cal-cell {
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #101010;
        border: 1px solid #262626;
        color: #ccc;
        font-size: 0.85rem;
        padding: 0;
        cursor: pointer;
      }
      .cal-cell:hover:not(.disabled):not(.empty) {
        border-color: #777;
      }
      .cal-cell.selected {
        background: #fff;
        color: #000;
        border-color: #fff;
      }
      .cal-cell.empty {
        background: transparent;
        border: none;
        cursor: default;
      }
      .cal-cell.disabled {
        opacity: 0.25;
        cursor: not-allowed;
        pointer-events: none;
      }
      .day-scroll {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding-bottom: 8px;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .day-scroll::-webkit-scrollbar {
        display: none;
      }
      .day-card {
        flex: 0 0 calc((100% - 30px) / 4);
        min-width: 74px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        min-height: 80px;
        padding: 12px 6px;
        background: #151515;
        border: 1px solid #333;
        color: #bbb;
        font-size: 0.9rem;
        cursor: pointer;
        transition: 0.2s;
      }
      .day-card .dnum {
        font-size: 1.4rem;
        font-weight: 800;
      }
      .day-card:hover {
        border-color: #777;
      }
      .day-card.selected {
        border-color: #fff;
        background: #fff;
        color: #000;
      }
      .time-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }
      .time-btn {
        padding: 16px 6px;
        background: #151515;
        border: 1px solid #333;
        color: #fff;
        font-size: 1.05rem;
        font-weight: 700;
        cursor: pointer;
        text-align: center;
        transition: 0.2s;
      }
      .time-btn:hover {
        border-color: #777;
      }
      .time-btn.selected {
        background: #fff;
        color: #000;
        border-color: #fff;
      }
      .time-btn:disabled,
      .time-btn.taken {
        opacity: 0.3;
        cursor: not-allowed;
        text-decoration: line-through;
      }
      @media (max-width: 640px) {
        body {
          padding: 14px;
        }
        #loginBox {
          margin: 40px auto;
        }
        form#manualForm {
          grid-template-columns: minmax(0, 1fr);
        }
        .time-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        th,
        td {
          padding: 8px 6px;
          font-size: 0.78rem;
        }
      }
      @media (max-width: 380px) {
        .time-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <div id="loginBox">
      <h2>ورود آرایشگر</h2>
      <input id="email" placeholder="ایمیل" />
      <input id="password" type="password" placeholder="رمز عبور" />
      <button onclick="login()">ورود</button>
      <p id="loginError" style="color: #f66"></p>
    </div>

    <div id="panel">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
        "
      >
        <h2>رزروهای NH</h2>
        <button onclick="logout()">خروج</button>
      </div>

      <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>تاریخ</th>
            <th>ساعت</th>
            <th>مشتری</th>
            <th>مدت</th>
            <th>منبع</th>
            <th>وضعیت</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      </div>

      <form id="manualForm" onsubmit="addManual(event)">
        <h3 style="grid-column: 1/-1">
          مسدود کردن دستی یک تایم (رزرو تلفنی/حضوری)
        </h3>

        <div style="grid-column: 1/-1">
          <div class="calendar-toolbar">
            <div class="calendar-label">انتخاب روز</div>
            <div class="date-picker-wrap">
              <button
                type="button"
                class="date-picker-btn"
                aria-label="انتخاب مستقیم تاریخ از تقویم"
                onclick="openAdminDatePicker()"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="3" y="4" width="18" height="18"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
              </button>
              <div class="cal-backdrop" id="mCalBackdrop" onclick="closeAdminDatePicker()"></div>
              <div class="cal-popup" id="mCalendarPopup"></div>
            </div>
          </div>
          <div class="day-scroll" id="mDateCalendar"></div>
        </div>

        <div style="grid-column: 1/-1">
          <div class="calendar-label" style="margin: 16px 0 8px">
            انتخاب ساعت
          </div>
          <div class="time-grid" id="mTimeGrid"></div>
        </div>

        <input id="mName" placeholder="نام مشتری (اختیاری)" />
        <button type="submit" style="margin-top: 8px">
          مسدود کردن این تایم
        </button>
      </form>
    </div>

    <script>
      const sb = window.supabase.createClient(
        "https://tqdjtdgbaropkjcnckwc.supabase.co",
        "sb_publishable_NsPsht-_8YkeLzXlexfnKg_5V4iwKuW",
      );

      async function login() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) {
          document.getElementById("loginError").textContent =
            "ایمیل یا رمز اشتباه است.";
          return;
        }
        await checkSession();
      }
      async function logout() {
        await sb.auth.signOut();
        location.reload();
      }

      async function checkSession() {
        const {
          data: { session },
        } = await sb.auth.getSession();
        if (!session) {
          return;
        }
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("panel").style.display = "block";
        await loadBookings();
      }

      async function loadBookings() {
        const { data, error } = await sb
          .from("bookings")
          .select("*")
          .gte("booking_date", new Date().toISOString().slice(0, 10))
          .order("booking_date")
          .order("booking_time");
        if (error) {
          console.error(error);
          return;
        }
        document.getElementById("rows").innerHTML = data
          .map(
            (b) => `
    <tr>
      <td>${new Date(b.booking_date + "T00:00:00").toLocaleDateString("fa-IR", { day: "numeric", month: "short" })}</td>
      <td>${b.booking_time.slice(0, 5)}</td>
      <td>${b.customer_name || "—"} ${b.customer_phone ? `<br><small>${b.customer_phone}</small>` : ""}</td>
      <td>${b.total_duration} دقیقه</td>
      <td><span class="badge ${b.source}">${b.source === "site" ? "سایت" : "دستی"}</span></td>
      <td><span class="badge ${b.status === "cancelled" ? "cancelled" : ""}">${b.status === "cancelled" ? "لغوشده" : "فعال"}</span></td>
      <td>${b.status === "confirmed" ? `<button class="danger" onclick="cancelBooking('${b.id}')">لغو</button>` : ""}</td>
    </tr>
  `,
          )
          .join("");
      }

      async function cancelBooking(id) {
        if (!confirm("این رزرو لغو شود؟")) return;
        const { error } = await sb
          .from("bookings")
          .update({ status: "cancelled" })
          .eq("id", id);
        if (error) {
          alert("خطا در لغو رزرو");
          return;
        }
        await loadBookings();
        await loadTakenTimesForDay();
      }

      async function addManual(e) {
        e.preventDefault();
        if (!mDay) return alert("لطفاً یک روز رو از تقویم انتخاب کنید.");
        if (!mTime) return alert("لطفاً یک ساعت رو انتخاب کنید.");
        const name =
          document.getElementById("mName").value.trim() || "رزرو حضوری/تلفنی";
        const duration = 45;
        const { error } = await sb.from("bookings").insert({
          booking_date: mDay,
          booking_time: mTime + ":00",
          customer_name: name,
          total_duration: duration,
          status: "confirmed",
          source: "manual",
        });
        if (error) {
          alert(
            error.code === "23505"
              ? "این تایم قبلاً رزرو شده است."
              : "خطا در ثبت.",
          );
          return;
        }
        e.target.reset();
        mDay = null;
        mTime = null;
        mTakenTimes = new Set();
        renderAdminCalendar();
        renderCalendarPopup();
        renderAdminTimes();
        await loadBookings();
      }

      checkSession();
      const ADMIN_TIMES = [
        { label: "۱۰:۰۰", value: "10:00" },
        { label: "۱۱:۰۰", value: "11:00" },
        { label: "۱۲:۳۰", value: "12:30" },
        { label: "۱۴:۰۰", value: "14:00" },
        { label: "۱۵:۳۰", value: "15:30" },
        { label: "۱۷:۰۰", value: "17:00" },
        { label: "۱۸:۳۰", value: "18:30" },
        { label: "۲۰:۰۰", value: "20:00" },
      ];
      let mDay = null,
        mTime = null,
        mTakenTimes = new Set();

      const FA_WEEKDAY_INDEX = {
        شنبه: 0,
        یکشنبه: 1,
        دوشنبه: 2,
        "سه‌شنبه": 3,
        چهارشنبه: 4,
        پنجشنبه: 5,
        جمعه: 6,
      };
      const FA_WEEKDAYS = ["ش", "ی", "د", "س", "چ", "پ", "ج"];
      const faLatnFmt = new Intl.DateTimeFormat("fa-IR-u-nu-latn", {
        year: "numeric",
        month: "numeric",
        day: "numeric",
      });
      function jParts(d) {
        const parts = faLatnFmt.formatToParts(d);
        const o = {};
        parts.forEach((p) => {
          if (p.type !== "literal") o[p.type] = parseInt(p.value, 10);
        });
        return { y: o.year, m: o.month, d: o.day };
      }
      function jMonthStart(refDate) {
        const jp = jParts(refDate);
        const start = new Date(refDate);
        start.setDate(start.getDate() - (jp.d - 1));
        return start;
      }
      function jMonthDays(monthStart) {
        const jp = jParts(monthStart);
        const days = [];
        let cur = new Date(monthStart);
        while (jParts(cur).m === jp.m) {
          days.push(new Date(cur));
          cur.setDate(cur.getDate() + 1);
        }
        return days;
      }

      function pickAdminDay(iso) {
        mDay = iso;
        mTime = null;
        closeAdminDatePicker();
        renderAdminCalendar();
        renderCalendarPopup();
        loadTakenTimesForDay();
      }

      async function loadTakenTimesForDay() {
        if (!mDay) {
          mTakenTimes = new Set();
          renderAdminTimes();
          return;
        }
        const { data, error } = await sb.rpc("get_taken_slots", {
          p_date: mDay,
        });
        if (error) {
          console.error(error);
          mTakenTimes = new Set();
          renderAdminTimes();
          return;
        }
        mTakenTimes = new Set((data || []).map((r) => r.booking_time.slice(0, 5)));
        renderAdminTimes();
      }

      function renderAdminCalendar() {
        const root = document.getElementById("mDateCalendar");
        const now = new Date();
        let cells = "";
        for (let i = 0; i < 30; i++) {
          let d = new Date(now);
          d.setDate(now.getDate() + i);
          let iso = d.toISOString().slice(0, 10);
          let wname = d.toLocaleDateString("fa-IR", { weekday: "short" });
          let dnum = d.toLocaleDateString("fa-IR", { day: "numeric" });
          let dmonth = d.toLocaleDateString("fa-IR", { month: "short" });
          cells += `<button type="button" class="day-card ${mDay === iso ? "selected" : ""}" onclick="pickAdminDay('${iso}')">
      <span>${wname}</span><span class="dnum">${dnum}</span><span>${dmonth}</span>
    </button>`;
        }
        root.innerHTML = cells;
        if (mDay) {
          let sel = root.querySelector(".day-card.selected");
          if (sel) sel.scrollIntoView({ inline: "nearest", block: "nearest" });
        }
      }

      let mViewDate = new Date();
      function renderCalendarPopup() {
        const root = document.getElementById("mCalendarPopup");
        const now = new Date();
        const minIso = now.toISOString().slice(0, 10);
        const maxDate = new Date(now);
        maxDate.setDate(now.getDate() + 29);
        const maxIso = maxDate.toISOString().slice(0, 10);
        const monthStart = jMonthStart(mViewDate);
        const days = jMonthDays(monthStart);
        const monthLabel = monthStart.toLocaleDateString("fa-IR", {
          month: "long",
          year: "numeric",
        });
        const firstOffset =
          FA_WEEKDAY_INDEX[
            monthStart.toLocaleDateString("fa-IR", { weekday: "long" })
          ] ?? 0;
        let head = `<div class="cal-pop-header"><button type="button" class="cal-nav" onclick="mChangeMonth(-1)">‹</button><span class="cal-pop-title">${monthLabel}</span><button type="button" class="cal-nav" onclick="mChangeMonth(1)">›</button></div>`;
        let cells = FA_WEEKDAYS.map(
          (w) => `<div class="cal-head">${w}</div>`,
        ).join("");
        for (let i = 0; i < firstOffset; i++)
          cells += `<div class="cal-cell empty"></div>`;
        days.forEach((d) => {
          const iso = d.toISOString().slice(0, 10);
          const dnum = d.toLocaleDateString("fa-IR", { day: "numeric" });
          const disabled = iso < minIso || iso > maxIso;
          const sel = mDay === iso;
          cells += `<button type="button" class="cal-cell ${disabled ? "disabled" : ""} ${sel ? "selected" : ""}" onclick="pickAdminDay('${iso}')">${dnum}</button>`;
        });
        root.innerHTML = head + `<div class="cal-pop-grid">${cells}</div>`;
      }
      function mChangeMonth(dir) {
        const monthStart = jMonthStart(mViewDate);
        if (dir < 0) {
          mViewDate = new Date(monthStart);
          mViewDate.setDate(mViewDate.getDate() - 1);
        } else {
          const days = jMonthDays(monthStart);
          mViewDate = new Date(days[days.length - 1]);
          mViewDate.setDate(mViewDate.getDate() + 1);
        }
        renderCalendarPopup();
      }

      function openAdminDatePicker() {
        document.getElementById("mCalendarPopup").classList.add("open");
        document.getElementById("mCalBackdrop").classList.add("open");
        mViewDate = mDay ? new Date(mDay + "T00:00:00") : new Date();
        renderCalendarPopup();
      }
      function closeAdminDatePicker() {
        document.getElementById("mCalendarPopup").classList.remove("open");
        document.getElementById("mCalBackdrop").classList.remove("open");
      }

      function renderAdminTimes() {
        document.getElementById("mTimeGrid").innerHTML = ADMIN_TIMES.map((t) => {
          const isTaken = mTakenTimes.has(t.value);
          const isSel = mTime === t.value;
          return `<button type="button" class="time-btn ${isSel ? "selected" : ""} ${isTaken ? "taken" : ""}"
      ${isTaken ? "disabled" : ""}
      onclick="mTime='${t.value}';renderAdminTimes()">${t.label}</button>`;
        }).join("");
      }

      renderAdminCalendar();
      renderCalendarPopup();
      renderAdminTimes();
    </script>
  </body>
</html>
