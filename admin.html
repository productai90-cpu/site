<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>پنل مدیریت NH</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      body {
        font-family: Vazirmatn, Tahoma, sans-serif;
        background: #0b0b0b;
        color: #f2f2f2;
        margin: 0;
        padding: 24px;
      }
      input,
      select {
        background: #151515;
        border: 1px solid #333;
        color: #fff;
        padding: 10px;
        margin: 4px 0;
        width: 100%;
        box-sizing: border-box;
      }
      button {
        background: #fff;
        color: #000;
        border: 0;
        padding: 10px 18px;
        cursor: pointer;
        font-weight: 700;
      }
      button.danger {
        background: #2a1414;
        color: #ff8080;
        border: 1px solid #522;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th,
      td {
        border-bottom: 1px solid #262626;
        padding: 10px;
        text-align: right;
        font-size: 0.85rem;
      }
      .badge {
        padding: 2px 8px;
        font-size: 0.7rem;
        border: 1px solid #444;
      }
      .badge.manual {
        background: #1a1a2a;
        border-color: #446;
      }
      .badge.site {
        background: #141a14;
        border-color: #464;
      }
      .badge.cancelled {
        opacity: 0.4;
        text-decoration: line-through;
      }
      #loginBox {
        max-width: 340px;
        margin: 80px auto;
      }
      #panel {
        display: none;
        max-width: 1000px;
        margin: auto;
      }
      form#manualForm {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        border: 1px solid #262626;
        padding: 16px;
        margin-top: 24px;
      }
      form#manualForm button {
        grid-column: 1/-1;
      }
      .day-scroll {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 6px;
        width: min(100%, 430px);
        padding: 2px;
      }
      .day-card {
        min-width: 0;
        min-height: 56px;
        padding: 6px 3px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1px;
        background: #151515;
        border: 1px solid #292929;
        color: #aaa;
        cursor: pointer;
        font-size: .7rem;
        transition: .18s;
      }
      .day-card .dnum { font-size: 1.05rem; font-weight: 800; line-height:1.05; }
      .day-card .dmonth { font-size: .58rem; color:#666; }
      .day-card:hover { border-color:#777; }
      .day-card.selected { background:#fff; color:#000; border-color:#fff; }
      .day-card.selected .dmonth { color:#555; }
      .calendar-toolbar {
        display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;
      }
      .calendar-label { font-size:.78rem; color:#999; letter-spacing:.5px; }
      .date-picker-wrap { position:relative; width:38px; height:38px; }
      .date-picker-btn {
        width:38px; height:38px; padding:0; margin:0; box-sizing:border-box; line-height:0;
        border:1px solid #444; background:#151515; color:#ccc; cursor:pointer;
        display:flex; align-items:center; justify-content:center; transition:.2s;
      }
      .date-picker-btn:hover, .date-picker-btn:focus-visible { border-color:#fff; color:#fff; outline:none; }
      .date-picker-btn svg { display:block; width:17px; height:17px; }
      .cal-popup {
        position:absolute; top:44px; right:0; z-index:50;
        width:min(280px, calc(100vw - 48px)); max-height:min(430px, 70vh); overflow:auto;
        background:#151515; border:1px solid #333; padding:10px; display:none;
        box-shadow:0 14px 35px rgba(0,0,0,.55); border-radius:2px;
      }
      .cal-popup.open { display:block; }
      .cal-month-title { display:flex; justify-content:space-between; align-items:center; color:#ddd; font-size:.76rem; font-weight:700; padding:0 2px 8px; }
      .cal-month-title small { color:#666; font-weight:500; }
      .cal-weekdays, .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
      .cal-head { text-align:center; font-size:.62rem; color:#777; padding:2px 0 5px; }
      .cal-cell {
        aspect-ratio:1; min-width:0; display:flex; align-items:center; justify-content:center;
        background:#101010; border:1px solid #262626; color:#ccc; font-size:.72rem; padding:0; cursor:pointer;
      }
      .cal-cell:hover { border-color:#777; }
      .cal-cell.selected { background:#fff; color:#000; border-color:#fff; }
      .cal-cell.disabled { opacity:.2; cursor:not-allowed; }
      .cal-cell.empty { background:transparent; border:none; cursor:default; }
      .cal-note { color:#555; font-size:.6rem; text-align:center; margin-top:8px; }
      @media (max-width: 640px) {
        body { padding:14px; }
        form#manualForm { grid-template-columns:1fr; padding:12px; }
        .day-scroll { grid-template-columns:repeat(5, minmax(0,1fr)); gap:5px; width:100%; }
        .day-card { min-height:52px; padding:5px 2px; }
        .day-card .dnum { font-size:1rem; }
        .cal-popup { right:0; width:min(270px, calc(100vw - 40px)); }
      }
      .time-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      .time-btn {
        padding: 16px 6px;
        background: #151515;
        border: 1px solid #333;
        color: #fff;
        font-size: 1.05rem;
        font-weight: 700;
        cursor: pointer;
        text-align: center;
        transition: 0.2s;
      }
      .time-btn:hover {
        border-color: #777;
      }
      .time-btn.selected {
        background: #fff;
        color: #000;
        border-color: #fff;
      }
      .time-btn:disabled,
      .time-btn.taken {
        opacity: 0.3;
        cursor: not-allowed;
        text-decoration: line-through;
      }
    </style>
  </head>
  <body>
    <div id="loginBox">
      <h2>ورود آرایشگر</h2>
      <input id="email" placeholder="ایمیل" />
      <input id="password" type="password" placeholder="رمز عبور" />
      <button onclick="login()">ورود</button>
      <p id="loginError" style="color: #f66"></p>
    </div>

    <div id="panel">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
        "
      >
        <h2>رزروهای NH</h2>
        <button onclick="logout()">خروج</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>تاریخ</th>
            <th>ساعت</th>
            <th>مشتری</th>
            <th>مدت</th>
            <th>منبع</th>
            <th>وضعیت</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>

      <form id="manualForm" onsubmit="addManual(event)">
        <h3 style="grid-column: 1/-1">
          مسدود کردن دستی یک تایم (رزرو تلفنی/حضوری)
        </h3>

        <div style="grid-column: 1/-1">
          <div class="calendar-toolbar">
            <div class="calendar-label">انتخاب روز</div>
            <div class="date-picker-wrap">
              <button
                type="button"
                class="date-picker-btn"
                aria-label="باز کردن تقویم شمسی"
                aria-expanded="false"
                onclick="openAdminDatePicker()"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="3" y="4" width="18" height="18"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
              </button>
              <div class="cal-popup" id="mCalendarPopup"></div>
            </div>
          </div>
          <div class="day-scroll" id="mDateCalendar"></div>
        </div>

        <div style="grid-column: 1/-1">
          <div class="calendar-label" style="margin: 16px 0 8px">
            انتخاب ساعت
          </div>
          <div class="time-grid" id="mTimeGrid"></div>
        </div>

        <input id="mName" placeholder="نام مشتری (اختیاری)" />
        <input
          id="mDuration"
          type="number"
          placeholder="مدت به دقیقه"
          value="45"
        />
        <button type="submit" style="margin-top: 8px">
          مسدود کردن این تایم
        </button>
      </form>
    </div>

    <script>
      const sb = window.supabase.createClient(
        "https://tqdjtdgbaropkjcnckwc.supabase.co",
        "sb_publishable_NsPsht-_8YkeLzXlexfnKg_5V4iwKuW",
      );

      async function login() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) {
          document.getElementById("loginError").textContent =
            "ایمیل یا رمز اشتباه است.";
          return;
        }
        await checkSession();
      }
      async function logout() {
        await sb.auth.signOut();
        location.reload();
      }

      async function checkSession() {
        const {
          data: { session },
        } = await sb.auth.getSession();
        if (!session) {
          return;
        }
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("panel").style.display = "block";
        await loadBookings();
      }

      async function loadBookings() {
        const { data, error } = await sb
          .from("bookings")
          .select("*")
          .gte("booking_date", new Date().toISOString().slice(0, 10))
          .order("booking_date")
          .order("booking_time");
        if (error) {
          console.error(error);
          return;
        }
        document.getElementById("rows").innerHTML = data
          .map(
            (b) => `
    <tr>
      <td>${new Date(b.booking_date + "T00:00:00").toLocaleDateString("fa-IR", { day: "numeric", month: "short" })}</td>
      <td>${b.booking_time.slice(0, 5)}</td>
      <td>${b.customer_name || "—"} ${b.customer_phone ? `<br><small>${b.customer_phone}</small>` : ""}</td>
      <td>${b.total_duration} دقیقه</td>
      <td><span class="badge ${b.source}">${b.source === "site" ? "سایت" : "دستی"}</span></td>
      <td><span class="badge ${b.status === "cancelled" ? "cancelled" : ""}">${b.status === "cancelled" ? "لغوشده" : "فعال"}</span></td>
      <td>${b.status === "confirmed" ? `<button class="danger" onclick="cancelBooking('${b.id}')">لغو</button>` : ""}</td>
    </tr>
  `,
          )
          .join("");
      }

      async function cancelBooking(id) {
        if (!confirm("این رزرو لغو شود؟")) return;
        const { error } = await sb
          .from("bookings")
          .update({ status: "cancelled" })
          .eq("id", id);
        if (error) {
          alert("خطا در لغو رزرو");
          return;
        }
        await loadBookings();
        await loadTakenTimesForDay();
      }

      async function addManual(e) {
        e.preventDefault();
        if (!mDay) return alert("لطفاً یک روز رو از تقویم انتخاب کنید.");
        if (!mTime) return alert("لطفاً یک ساعت رو انتخاب کنید.");
        const name =
          document.getElementById("mName").value.trim() || "رزرو حضوری/تلفنی";
        const duration = +document.getElementById("mDuration").value || 45;
        const { error } = await sb.from("bookings").insert({
          booking_date: mDay,
          booking_time: mTime + ":00",
          customer_name: name,
          total_duration: duration,
          status: "confirmed",
          source: "manual",
        });
        if (error) {
          alert(
            error.code === "23505"
              ? "این تایم قبلاً رزرو شده است."
              : "خطا در ثبت.",
          );
          return;
        }
        e.target.reset();
        document.getElementById("mDuration").value = 45;
        mDay = null;
        mTime = null;
        mTakenTimes = new Set();
        renderAdminCalendar();
        renderCalendarPopup();
        renderAdminTimes();
        await loadBookings();
      }

      checkSession();
      const ADMIN_TIMES = [
        { label: "۱۰:۰۰", value: "10:00" },
        { label: "۱۱:۰۰", value: "11:00" },
        { label: "۱۲:۳۰", value: "12:30" },
        { label: "۱۴:۰۰", value: "14:00" },
        { label: "۱۵:۳۰", value: "15:30" },
        { label: "۱۷:۰۰", value: "17:00" },
        { label: "۱۸:۳۰", value: "18:30" },
        { label: "۲۰:۰۰", value: "20:00" },
      ];
      let mDay = null,
        mTime = null,
        mTakenTimes = new Set();

      const FA_WEEKDAYS = ["ش", "ی", "د", "س", "چ", "پ", "ج"];
      const faCalendar = new Intl.DateTimeFormat("fa-IR-u-ca-persian", {
        year:"numeric", month:"long", day:"numeric", weekday:"long"
      });
      function localIso(d) {
        const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
        return `${y}-${m}-${day}`;
      }
      function faParts(d) {
        const p=Object.fromEntries(faCalendar.formatToParts(d).map(x=>[x.type,x.value]));
        return {year:p.year, month:p.month, day:p.day, weekday:p.weekday};
      }

      function pickAdminDay(iso) {
        mDay = iso;
        mTime = null;
        document.getElementById("mCalendarPopup").classList.remove("open");
        document.querySelector(".date-picker-btn")?.setAttribute("aria-expanded","false");
        renderAdminCalendar();
        renderCalendarPopup();
        loadTakenTimesForDay();
      }

      async function loadTakenTimesForDay() {
        if (!mDay) {
          mTakenTimes = new Set();
          renderAdminTimes();
          return;
        }
        const { data, error } = await sb.rpc("get_taken_slots", {
          p_date: mDay,
        });
        if (error) {
          console.error(error);
          mTakenTimes = new Set();
          renderAdminTimes();
          return;
        }
        mTakenTimes = new Set((data || []).map((r) => r.booking_time.slice(0, 5)));
        renderAdminTimes();
      }

      function renderAdminCalendar() {
        const root = document.getElementById("mDateCalendar");
        const now = new Date();
        let cells = "";
        for (let i=0; i<30; i++) {
          const d=new Date(now); d.setDate(now.getDate()+i);
          const iso=localIso(d), p=faParts(d), off=d.getDay()===5;
          cells += `<button type="button" class="day-card ${mDay===iso?"selected":""}" ${off?"disabled":""} onclick="pickAdminDay('${iso}')"><span>${p.weekday}</span><span class="dnum">${p.day}</span><span class="dmonth">${p.month}</span></button>`;
        }
        root.innerHTML=cells;
      }

      function renderCalendarPopup() {
        const root=document.getElementById("mCalendarPopup");
        const now=new Date(), dates=[];
        for(let i=0;i<30;i++){ const d=new Date(now); d.setDate(now.getDate()+i); dates.push(d); }
        const groups=new Map();
        dates.forEach(d=>{ const p=faParts(d), key=`${p.year}-${p.month}`; if(!groups.has(key)) groups.set(key,{year:p.year,month:p.month,dates:[]}); groups.get(key).dates.push(d); });
        let html="";
        for(const group of groups.values()){
          const first=group.dates[0], offset=(first.getDay()+1)%7;
          let grid="";
          for(let i=0;i<offset;i++) grid+=`<div class="cal-cell empty"></div>`;
          group.dates.forEach(d=>{
            const iso=localIso(d), p=faParts(d), off=d.getDay()===5;
            grid+=`<button type="button" class="cal-cell ${mDay===iso?"selected":""} ${off?"disabled":""}" ${off?"disabled":""} onclick="pickAdminDay('${iso}')">${p.day}</button>`;
          });
          html+=`<section><div class="cal-month-title"><span>${group.month}</span><small>${group.year}</small></div><div class="cal-weekdays">${FA_WEEKDAYS.map(h=>`<div class="cal-head">${h}</div>`).join("")}</div><div class="cal-grid">${grid}</div></section>`;
        }
        root.innerHTML=html+`<div class="cal-note">۳۰ روز آینده · تقویم شمسی · جمعه‌ها تعطیل</div>`;
      }

      function openAdminDatePicker() {
        const popup=document.getElementById("mCalendarPopup");
        const btn=document.querySelector(".date-picker-btn");
        const willOpen=!popup.classList.contains("open");
        popup.classList.toggle("open",willOpen);
        btn?.setAttribute("aria-expanded",String(willOpen));
        if(willOpen) renderCalendarPopup();
      }

      document.addEventListener("click",(e)=>{
        const wrap=document.querySelector(".date-picker-wrap"), popup=document.getElementById("mCalendarPopup");
        if(wrap && popup && !wrap.contains(e.target)){ popup.classList.remove("open"); document.querySelector(".date-picker-btn")?.setAttribute("aria-expanded","false"); }
      });

      function renderAdminTimes() {
        document.getElementById("mTimeGrid").innerHTML = ADMIN_TIMES.map((t) => {
          const isTaken = mTakenTimes.has(t.value);
          const isSel = mTime === t.value;
          return `<button type="button" class="time-btn ${isSel ? "selected" : ""} ${isTaken ? "taken" : ""}"
      ${isTaken ? "disabled" : ""}
      onclick="mTime='${t.value}';renderAdminTimes()">${t.label}</button>`;
        }).join("");
      }

      renderAdminCalendar();
      renderCalendarPopup();
      renderAdminTimes();
    </script>
  </body>
</html>
